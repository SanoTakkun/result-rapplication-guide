<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アキバギルド業務管理 プロトタイプ</title>
  <style>
    :root {
      --bg: #fff5f7;
      --panel: #fffafa;
      --ink: #1f0b10;
      --muted: #7a5b64;
      --line: #f1c7d1;
      --primary: #d71920;
      --primary-dark: #960d17;
      --danger: #a40012;
      --accent: #fff0f4;
      --pink: #ff5f93;
      --soft-pink: #ffe2eb;
      --sub-black: #16090d;
      --shadow: 0 14px 34px rgba(110, 8, 24, 0.14);
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #fff8fa 0%, var(--bg) 44%, #ffe9ef 100%);
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(215, 25, 32, 0.15), rgba(255, 95, 147, 0.14)),
        linear-gradient(180deg, #fffafb, #ffe8ef),
        var(--bg);
    }

    .login-card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--primary), var(--pink), var(--sub-black));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(215, 25, 32, 0.28);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-top: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(255, 95, 147, 0.22);
      border-color: var(--primary);
    }

    .primary-btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px 16px;
      background: linear-gradient(135deg, var(--primary), #ff3d75);
      color: #fff;
      box-shadow: 0 10px 20px rgba(215, 25, 32, 0.24);
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: linear-gradient(90deg, var(--sub-black), #5b0b12 58%, var(--primary-dark));
      border-bottom: 1px solid rgba(255, 226, 235, 0.38);
      color: #fff;
    }

    .topbar h1 {
      font-size: 18px;
    }

    .topbar .subtle {
      color: #ffd4df;
    }

    .terminal-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .terminal-select {
      width: auto;
      min-width: 112px;
      padding: 6px 28px 6px 10px;
      border-color: rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .terminal-select option {
      color: var(--ink);
      background: #fff;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffe5ec;
      font-size: 13px;
    }

    .ghost-btn {
      padding: 9px 12px;
      background: var(--soft-pink);
      color: var(--ink);
      border: 1px solid #ffc1d1;
    }

    .topbar .ghost-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.24);
    }

    .topbar .ghost-btn:disabled {
      opacity: 0.68;
      cursor: not-allowed;
      transform: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: 210px minmax(420px, 1fr) 280px;
      gap: 18px;
      padding: 18px;
      align-items: start;
    }

    .menu-panel,
    .task-panel {
      min-height: calc(100vh - 104px);
    }

    .business-menu {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .menu-btn {
      width: 100%;
      padding: 14px 12px;
      text-align: left;
      background: #fff4f7;
      color: var(--ink);
      border: 1px solid #ffc1d1;
    }

    .menu-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      box-shadow: 0 10px 18px rgba(215, 25, 32, 0.18);
    }

    .work-panel {
      min-height: calc(100vh - 104px);
    }

    .work-content {
      padding: 14px;
    }

    .work-content:has(#screen-shift.active) {
      padding: 10px;
    }

    .work-screen {
      display: none;
    }

    .work-screen.active {
      display: block;
    }

    .screen-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 14px;
    }

    .role-feature-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #fff8fa;
    }

    .role-feature-tab {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
    }

    .role-feature-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .role-feature-content {
      min-height: 260px;
      padding: 20px;
    }

    .account-management-head,
    .account-management-row {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr 0.8fr auto;
      gap: 10px;
      align-items: center;
    }

    .account-management-head {
      margin-bottom: 12px;
      grid-template-columns: 1fr auto;
    }

    .account-management-list {
      display: grid;
      gap: 8px;
    }

    .account-management-row {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .account-management-actions {
      display: flex;
      gap: 6px;
    }

    .account-editor {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8fa;
    }

    .shift-request-form,
    .shift-request-card,
    .role-task-card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .shift-request-list,
    .role-task-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .shift-request-period {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .shift-request-deadline {
      color: var(--primary-dark);
      font-weight: 900;
    }

    .shift-request-card-actions,
    .shift-request-account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .shift-request-account-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .shift-request-account-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) 90px 90px auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .cast-shift-entry-wrap {
      margin-top: 14px;
      display: grid;
      gap: 8px;
    }

    .cast-shift-entry-row {
      display: grid;
      grid-template-columns: 92px minmax(170px, 1fr) minmax(290px, 1.4fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .cast-shift-date {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 900;
      white-space: nowrap;
    }

    .cast-shift-weekday {
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff8fa;
    }

    .cast-shift-weekday.saturday {
      color: #2368ad;
      border-color: #8bb9e5;
    }

    .cast-shift-weekday.sunday {
      color: #b6293e;
      border-color: #e19aa5;
    }

    .cast-shift-reference {
      display: grid;
      gap: 5px;
      padding: 8px 10px;
      border: 1px solid #ead8de;
      border-radius: 7px;
      background: #fff8fa;
      font-size: 0.85rem;
    }

    .cast-shift-reference span {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .cast-shift-reference strong {
      color: var(--primary-dark);
    }

    .cast-shift-time-pair {
      display: grid;
      grid-template-columns: auto minmax(80px, 1fr) auto minmax(80px, 1fr);
      gap: 7px;
      align-items: center;
    }

    .cast-shift-time-pair label {
      font-size: 0.8rem;
      font-weight: 900;
    }

    .cast-shift-row-actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .shift-application-date-list {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .shift-application-date {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff8fa;
    }

    .shift-application-date h4 {
      margin: 0;
      color: var(--primary-dark);
    }

    .shift-application-status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #fff;
    }

    .shift-builder-sheet-wrap {
      margin-top: 14px;
      overflow: auto;
      max-height: 68vh;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .shift-builder-sheet {
      width: 100%;
      min-width: max-content;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
    }

    .shift-builder-sheet th,
    .shift-builder-sheet td {
      min-width: 190px;
      padding: 9px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .shift-builder-sheet thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #f7edf1;
      color: var(--primary-dark);
      text-align: center;
    }

    .shift-builder-sheet .shift-builder-cast-heading,
    .shift-builder-sheet .shift-builder-cast-name {
      position: sticky;
      left: 0;
      min-width: 130px;
      max-width: 130px;
      z-index: 2;
      background: #fff8fa;
      vertical-align: middle;
    }

    .shift-builder-sheet .shift-builder-cast-heading {
      z-index: 4;
      background: #f7edf1;
    }

    .shift-builder-cell {
      display: grid;
      gap: 8px;
    }

    .shift-builder-available {
      padding: 6px 8px;
      border-radius: 6px;
      background: #f5f5f5;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .shift-builder-time {
      display: grid;
      grid-template-columns: 40px minmax(92px, 1fr) 40px;
      gap: 5px;
      align-items: center;
    }

    .shift-builder-time span {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .shift-builder-time button {
      min-width: 36px;
      padding: 7px 5px;
      font-weight: 800;
    }

    .shift-date-setting-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 10px;
    }

    .shift-date-setting-grid .full {
      grid-column: 1 / -1;
    }

    .shift-published-label {
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      background: #dcf6e4;
      color: #174d2b;
      font-size: 12px;
      font-weight: 900;
    }

    .table-management-layout {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 150px;
      gap: 12px;
      align-items: start;
    }

    .attendance-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .attendance-column {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .attendance-panel-head {
      display: grid;
      gap: 7px;
      padding: 9px 10px;
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
    }

    .attendance-panel h3 {
      margin: 0;
      color: #fff;
      font-size: 13px;
    }

    .attendance-view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .attendance-view-btn {
      min-width: 0;
      padding: 6px 4px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 10px;
      line-height: 1.2;
    }

    .attendance-view-btn.active {
      background: #fff;
      color: var(--primary-dark);
    }

    .attendance-list {
      display: grid;
      gap: 7px;
      max-height: calc(100vh - 230px);
      overflow: auto;
      padding: 8px;
      background: #fff8fa;
    }

    .attendance-time-group {
      display: grid;
      gap: 6px;
    }

    .attendance-time-label {
      position: sticky;
      top: -8px;
      z-index: 1;
      padding: 5px 7px;
      border-bottom: 2px solid var(--primary);
      background: #fff0f4;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .attendance-time-casts {
      display: grid;
      gap: 7px;
    }

    .departure-schedule-list {
      display: grid;
      gap: 9px;
      padding: 8px;
      background: #fff8fa;
    }

    .departure-schedule-card {
      padding: 7px 8px;
      border: 1px solid #ffc1d1;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .departure-schedule-card.is-departing-soon {
      border-color: #ef9db2;
      background: #ffe4ec;
      color: #8f2944;
    }

    .departure-schedule-card.is-departure-overdue {
      border-color: #e75480;
      background: #f58bab;
      color: #5f1028;
    }

    .departure-schedule-card.is-departed {
      border-color: #b9bec5;
      background: #e8eaed;
      color: #535960;
    }

    .attendance-status-drop-zones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid var(--line);
      background: #fff0f4;
    }

    .attendance-status-drop-zones[hidden] {
      display: none;
    }

    .table-action-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .table-action-panel[hidden] {
      display: none;
    }

    .table-action-column {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .table-action-panel h3 {
      margin: 0;
      padding: 9px 10px;
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      font-size: 13px;
      text-align: center;
    }

    .break-management-list {
      display: grid;
      gap: 10px;
      padding: 8px;
      background: #fff8fa;
    }

    .break-management-group {
      display: grid;
      gap: 6px;
    }

    .break-management-label {
      padding: 5px 7px;
      border-bottom: 2px solid var(--primary);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .break-management-card {
      padding: 7px 8px;
      border: 1px solid #ffc1d1;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .break-management-card.is-on-break {
      border-color: #dfc66f;
      background: #fff4bd;
      color: #6b5812;
    }

    .break-management-card.is-break-done {
      border-color: #b9bec5;
      background: #e8eaed;
      color: #535960;
    }

    .attendance-status-drop-zone {
      display: grid;
      min-height: 48px;
      place-items: center;
      padding: 6px;
      border: 2px dashed #d98a9d;
      border-radius: 8px;
      background: #fff;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .attendance-status-drop-zone.is-dragover {
      border-style: solid;
      border-color: var(--primary);
      background: #ffe2eb;
      box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
    }

    .attendance-status-drop-zone[data-attendance-status-drop="出勤中"] {
      border-color: #83c89b;
      background: #dcf6e4;
      color: #174d2b;
    }

    .attendance-status-drop-zone[data-attendance-status-drop="遅刻"] {
      border-color: #91bfe8;
      background: #e1f1ff;
      color: #174f7e;
    }

    .attendance-status-drop-zone[data-attendance-status-drop="欠勤"] {
      border-color: #ef9da6;
      background: #ffe1e5;
      color: #7e1822;
    }

    .attendance-status-drop-zone[data-attendance-status-drop="無欠"] {
      border-color: #a80d18;
      background: #d71920;
      color: #fff;
    }

    .attendance-status-drop-zone[data-attendance-working-status-drop="休憩中"] {
      border-color: #dfc66f;
      background: #fff4bd;
      color: #6b5812;
    }

    .attendance-status-drop-zone[data-attendance-working-status-drop="休憩済み"] {
      border-color: #83c89b;
      background: #dcf6e4;
      color: #174d2b;
    }

    .attendance-status-drop-zone[data-attendance-working-status-drop="退勤"] {
      border-color: #b9bec5;
      background: #e8eaed;
      color: #535960;
    }

    .register-transfer-notice {
      margin: 12px 14px 0;
      padding: 10px 12px;
      border: 2px solid #ff168f;
      border-radius: 8px;
      background: #fff0f8;
      color: var(--ink);
      font-weight: 900;
    }

    .attendance-card {
      display: grid;
      gap: 3px;
      padding: 8px;
      border: 1px solid #ffc1d1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: grab;
      box-shadow: 0 5px 12px rgba(215, 25, 32, 0.08);
      user-select: none;
    }

    .attendance-card:active {
      cursor: grabbing;
    }

    .attendance-card.dragging {
      opacity: 0.55;
    }

    .attendance-card.is-working {
      border-color: #83c89b;
      background: #dcf6e4;
      color: #174d2b;
      box-shadow: 0 5px 12px rgba(44, 126, 73, 0.14);
    }

    .attendance-card.is-absent {
      border-color: #ef9da6;
      background: #ffe1e5;
      color: #7e1822;
      box-shadow: 0 5px 12px rgba(190, 43, 58, 0.14);
    }

    .attendance-card.is-late {
      border-color: #91bfe8;
      background: #e1f1ff;
      color: #174f7e;
      box-shadow: 0 5px 12px rgba(48, 112, 168, 0.14);
    }

    .attendance-card.is-on-break {
      border-color: #dfc66f;
      background: #fff4bd;
      color: #6b5812;
      box-shadow: 0 5px 12px rgba(164, 133, 26, 0.14);
    }

    .attendance-card.is-clocked-out {
      border-color: #b9bec5;
      background: #e8eaed;
      color: #535960;
      box-shadow: 0 5px 12px rgba(83, 89, 96, 0.1);
    }

    .attendance-card.is-no-show {
      border-color: #a80d18;
      background: #d71920;
      color: #fff;
      box-shadow: 0 6px 14px rgba(168, 13, 24, 0.3);
    }

    .attendance-name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
    }

    .attendance-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .table-sheet-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      max-height: calc(100vh - 230px);
    }

    .table-sheet {
      position: relative;
      display: grid;
      grid-template-columns: 44px repeat(11, 62px 17px);
      width: max-content;
      min-width: 0;
    }

    .table-current-time-line {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 6;
      height: 3px;
      background: #e0001b;
      box-shadow: 0 1px 4px rgba(224, 0, 27, 0.45);
      pointer-events: none;
      transform: translateY(-1px);
    }

    .table-current-time-line::before {
      content: attr(data-current-time);
      position: absolute;
      left: 2px;
      top: 50%;
      padding: 2px 4px;
      border-radius: 4px;
      background: #e0001b;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-50%);
    }

    .table-sheet-corner,
    .table-sheet-col,
    .table-sheet-row {
      position: sticky;
      z-index: 2;
      display: grid;
      place-items: center;
      min-height: 34px;
      border-right: 1px solid #ffd4de;
      border-bottom: 1px solid #ffd4de;
      background: #fff0f4;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      white-space: pre-line;
    }

    .table-sheet-corner {
      left: 0;
      top: 0;
      z-index: 4;
    }

    .table-sheet-col {
      top: 0;
      z-index: 3;
    }

    .table-sheet-col-group {
      grid-column: span 2;
      border-right: 2px solid #6e0818;
    }

    .table-sheet-row {
      left: 0;
      z-index: 3;
    }

    .table-sheet-row.hour-boundary,
    .table-sheet-cell.hour-boundary {
      border-top: 2px solid #6e0818;
    }

    .table-sheet-cell {
      display: block;
      width: 100%;
      min-height: 46px;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 6px 7px;
      box-shadow: none;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      overflow: hidden;
      white-space: pre;
      word-break: keep-all;
      overflow-wrap: normal;
      text-align: center;
      cursor: pointer;
      background: #fff;
    }

    .table-sheet-cell:focus {
      position: relative;
      z-index: 1;
      background: #fff8fa;
    }

    .table-sheet-cell.is-selected {
      position: relative;
      z-index: 1;
      background: #fff8fa;
      box-shadow: inset 0 0 0 2px rgba(215, 25, 32, 0.55);
    }

    .table-sheet-cell:hover {
      background: #fff8fa;
    }

    .table-sheet-cell.has-nomination {
      background: #fff0f8;
    }

    .table-sheet-cell.has-nomination[data-table-field="name"] {
      border-right-color: #ffe1e8;
      box-shadow:
        inset 2px 0 0 #ff168f,
        inset 0 2px 0 #ff168f,
        inset 0 -2px 0 #ff168f;
    }

    .table-sheet-cell.has-nomination[data-table-field="minute"] {
      border-right-color: #ff168f;
      box-shadow:
        inset -2px 0 0 #ff168f,
        inset 0 2px 0 #ff168f,
        inset 0 -2px 0 #ff168f;
    }

    .table-sheet-cell[data-table-field="name"] .table-name-nomination {
      color: #ff168f;
      font-weight: 900;
    }

    .table-sheet-cell[data-table-field="minute"] .table-minute-nomination {
      color: #ff168f;
      font-weight: 900;
    }

    .table-sheet-cell.drop-target {
      outline: 2px solid var(--primary);
      background: #fff0f4;
    }

    .table-sheet-cell[data-table-field="name"] {
      border-right-color: #ffe1e8;
      padding-block: 1px;
      padding-inline: 2px;
    }

    .table-sheet-cell[data-table-field="minute"] {
      border-right: 2px solid #6e0818;
      padding-block: 1px;
      padding-inline: 1px;
    }

    .table-sheet-empty {
      grid-column: 1 / -1;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      background: #fff8fa;
    }

    .minute-picker {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .minute-picker select {
      min-height: 152px;
      padding: 8px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .minute-picker option {
      padding: 8px;
    }

    .table-cell-editor-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .table-cell-editor-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 86px 110px auto;
      gap: 8px;
      align-items: center;
    }

    .table-cell-editor-head {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 86px 110px auto;
      gap: 8px;
      padding-inline: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .table-cell-editor-head span:last-child {
      min-width: 50px;
      text-align: center;
    }

    .table-cell-editor-row input,
    .table-cell-editor-row select {
      width: 100%;
      min-height: 40px;
    }

    .table-cell-editor-empty {
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      background: #fff8fa;
    }

    @media (max-width: 900px) {
      .table-management-layout {
        grid-template-columns: 1fr;
      }

      .attendance-list {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        max-height: 180px;
      }
    }

    .status-list {
      display: grid;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .shift-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .shift-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .shift-table th,
    .shift-table td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .shift-table th {
      background: #fff0f4;
      color: var(--primary-dark);
      font-size: 13px;
      white-space: nowrap;
    }

    .shift-table tr:last-child td {
      border-bottom: 0;
    }

    .shift-table input,
    .shift-table select {
      min-width: 120px;
      padding: 9px 10px;
    }

    .shift-time-list {
      display: grid;
      gap: 8px;
    }

    .shift-time-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .shift-time-heading {
      padding: 7px 12px;
      background: linear-gradient(90deg, var(--primary), var(--sub-black));
      color: #fff;
      font-size: 15px;
      font-weight: 900;
    }

    .shift-time-header,
    .shift-cast-row {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) minmax(110px, 0.8fr) minmax(130px, 0.9fr) minmax(220px, 1.4fr);
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
    }

    .shift-time-header {
      background: #fff0f4;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      border-bottom: 1px solid var(--line);
    }

    .shift-cast-row {
      border-bottom: 1px solid var(--line);
    }

    .shift-cast-row:last-child {
      border-bottom: 0;
    }

    .shift-cast-row.outside-work {
      background: #12090c;
      color: #fff;
    }

    .shift-cast-row.outside-work .status-badge {
      background: #2a1118;
      border-color: #5c2b36;
      color: #fff;
    }

    .shift-cast-row.outside-work .cast-meta {
      color: #ffd7e1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #fff0f4;
      border: 1px solid #ffc1d1;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .cast-cell {
      display: grid;
      gap: 2px;
    }

    .cast-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .action-group,
    .late-editor {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .action-btn {
      padding: 5px 8px;
      background: #fff4f7;
      color: var(--ink);
      border: 1px solid #ffc1d1;
      white-space: nowrap;
      font-size: 12px;
    }

    .action-btn.primary-action {
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      border-color: transparent;
    }

    .late-editor select {
      width: auto;
      min-width: 72px;
    }

    .task-space {
      min-height: 420px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255, 226, 235, 0.58), rgba(255, 255, 255, 0));
    }

    .share-list {
      display: grid;
      gap: 10px;
    }

    .share-form-stack {
      display: grid;
      gap: 12px;
    }

    .repeat-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .repeat-setting-row label {
      margin: 0;
    }

    .repeat-overlay {
      z-index: 70;
      background: rgba(22, 9, 13, 0.68);
    }

    .repeat-summary {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .repeat-date-list,
    .weekday-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weekday-btn {
      padding: 8px 12px;
      background: #fff4f7;
      color: var(--ink);
      border: 1px solid #ffc1d1;
    }

    .weekday-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      border-color: transparent;
    }

    .share-item {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .share-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .share-item-title {
      font-weight: 900;
    }

    .share-item-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .share-item-body {
      color: var(--ink);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .nomination-share-item {
      border: 2px solid #ff168f;
      background: #fff0f8;
    }

    .nomination-share-item.nomination-alert {
      border-color: #d71920;
      background: #ffe2eb;
      box-shadow: 0 0 0 3px rgba(255, 22, 143, 0.2);
    }

    .nomination-share-title {
      color: #ff168f;
      font-weight: 900;
    }

    .nomination-share-count,
    .nomination-share-remaining {
      font-weight: 900;
    }

    .nomination-share-remaining.is-alert {
      color: #d71920;
    }

    .nomination-share-actions {
      display: flex;
      gap: 8px;
    }

    .nomination-share-actions button {
      flex: 1;
    }

    .departure-share-item {
      border: 2px solid #d98a9d;
      background: #fff8fa;
    }

    .departure-share-names {
      font-weight: 800;
      line-height: 1.7;
      white-space: pre-line;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(110, 8, 24, 0.08);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffafa, #fff1f5);
    }

    .panel-head h2 {
      font-size: 16px;
    }

    .work-title-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .shift-sort-controls {
      display: none;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .shift-sort-controls.visible {
      display: flex;
    }

    .sort-toggle {
      display: inline-flex;
      gap: 4px;
      padding: 3px;
      border: 1px solid #ffc1d1;
      border-radius: 8px;
      background: #fff;
    }

    .sort-toggle-btn {
      padding: 7px 12px;
      background: transparent;
      color: var(--ink);
      border: 0;
      min-width: 58px;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      color: #fff;
      box-shadow: 0 6px 12px rgba(215, 25, 32, 0.16);
    }

    .shift-title-actions {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .shift-title-actions.visible {
      display: flex;
    }

    .shift-tool-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      place-items: center;
      padding: 22px;
      background: rgba(22, 9, 13, 0.58);
      backdrop-filter: blur(3px);
    }

    .shift-tool-panel.active {
      display: grid;
    }

    .shift-modal {
      width: min(760px, 100%);
      max-height: min(760px, calc(100vh - 44px));
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff7fa;
      box-shadow: 0 24px 70px rgba(22, 9, 13, 0.32);
    }

    .shift-modal h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .shift-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
    }

    .shift-form-grid .full {
      grid-column: 1 / -1;
    }

    .shift-form-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .danger-btn {
      background: var(--danger);
      color: #fff;
      border-color: transparent;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      color: var(--ink);
    }

    .form-message {
      min-height: 18px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
    }

    .catalog-tools {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 14px;
    }

    .product {
      min-height: 96px;
      text-align: left;
      background: var(--accent);
      border: 1px solid #ffc2d2;
      padding: 12px;
      color: var(--ink);
      box-shadow: 0 5px 14px rgba(215, 25, 32, 0.08);
    }

    .product:hover {
      background: #ffe2eb;
      box-shadow: 0 9px 18px rgba(215, 25, 32, 0.14);
    }

    .product strong {
      display: block;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .product span {
      color: var(--muted);
      font-size: 13px;
    }

    .cart {
      display: grid;
      grid-template-rows: auto minmax(160px, 1fr) auto;
    }

    .cart-list {
      padding: 0;
      margin: 0;
      list-style: none;
      max-height: 40vh;
      overflow: auto;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .cart-name {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }

    .qty-controls button {
      width: 32px;
      height: 32px;
      background: var(--soft-pink);
      color: var(--ink);
      border: 1px solid #ffc1d1;
    }

    .remove {
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      padding: 22px 14px;
      text-align: center;
    }

    .summary {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
    }

    .summary-row.total {
      color: var(--primary-dark);
      font-size: 24px;
      font-weight: 900;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 2px;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .complete-btn {
      width: 100%;
      padding: 14px 16px;
      margin-top: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--sub-black));
      box-shadow: 0 10px 22px rgba(215, 25, 32, 0.24);
    }

    .complete-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .history {
      padding: 14px;
      border-top: 1px solid var(--line);
      background: #fff5f7;
    }

    .history h2 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 150px;
      overflow: auto;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .menu-panel,
      .task-panel,
      .work-panel {
        min-height: auto;
      }

      .cart-list {
        max-height: none;
      }

      .shift-time-header {
        display: none;
      }

      .shift-cast-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 560px) {
      .topbar,
      .top-actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .workspace {
        padding: 10px;
      }

      .catalog-tools,
      .payment-grid,
      .screen-grid {
        grid-template-columns: 1fr;
      }

      .account-management-row {
        grid-template-columns: 1fr;
      }

      .shift-request-account-row {
        grid-template-columns: 1fr;
      }

      .shift-date-setting-grid {
        grid-template-columns: 1fr;
      }

      .shift-builder-sheet-wrap {
        max-height: 62vh;
      }

      .cast-shift-entry-row {
        grid-template-columns: 1fr;
      }

      .cast-shift-row-actions {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main id="loginScreen" class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand">
        <div class="brand-mark">AG</div>
        <div>
          <h1 id="loginTitle">アキバギルド業務管理</h1>
          <p class="subtle">デモログイン: akibaguild / AG000 / 000000</p>
        </div>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="castName">キャスト名</label>
          <input id="castName" name="castName" autocomplete="name" value="akibaguild" required />
        </div>
        <div class="field">
          <label for="employeeNumber">従業員番号</label>
          <input id="employeeNumber" name="employeeNumber" autocomplete="username" value="AG000" required />
        </div>
        <div class="field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" value="000000" required />
        </div>
        <button class="primary-btn" type="submit">ログイン</button>
        <div id="loginError" class="error" role="alert"></div>
      </form>
    </section>
  </main>

  <main id="appScreen" class="app hidden">
    <header class="topbar">
      <div>
        <h1>アキバギルド業務管理</h1>
        <div class="terminal-row subtle">
          <span>入力端末</span>

    function minutesToClock(totalMinutes) {
      const normalizedMinutes = ((totalMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
      const hours = Math.floor(normalizedMinutes / 60);
      const minutes = normalizedMinutes % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
    }

    function tableTimeSlots() {
      const ranges = shiftRows
        .filter((row) => row.status !== "店舗外業務" && row.startTime && row.endTime)
        .map((row) => {
          const start = timeToMinutes(row.startTime);
          let end = timeToMinutes(row.endTime);
          if (start === null || end === null) return null;
          if (end < start) end += 24 * 60;
          return { start, end };
        })
        .filter(Boolean);

      if (ranges.length === 0) return [];

      const firstStart = Math.min(...ranges.map((range) => range.start));
      const lastEnd = Math.max(...ranges.map((range) => range.end));
      const firstSlot = Math.floor(firstStart / 30) * 30;
      const lastSlot = Math.ceil(lastEnd / 30) * 30;
      const slots = [];

      for (let minutes = firstSlot; minutes <= lastSlot; minutes += 30) {
        slots.push({
          key: String(minutes),
          label: minutesToClock(minutes)
        });
      }

      return slots;
    }

    function attendanceRows() {
      const statusPriority = new Map([
        ["出勤中", 0],
        ["休憩中", 1],
        ["遅刻", 2],
        ["出勤予定", 3],
        ["退勤", 4],
        ["欠勤", 5],
        ["無欠", 6]
      ]);
      return shiftRows
        .filter((row) => row.status !== "店舗外業務" && row.startTime && row.endTime)
        .slice()
        .sort((a, b) => {
          const statusCompare = (statusPriority.get(a.status) ?? 99) - (statusPriority.get(b.status) ?? 99);
          if (statusCompare !== 0) return statusCompare;
          const startCompare = (a.startTime || "99:99").localeCompare(b.startTime || "99:99");
          if (startCompare !== 0) return startCompare;
          return a.name.localeCompare(b.name, "ja");
        });
    }

    function scheduledAttendanceRows() {
      return shiftRows
        .filter((row) => row.status !== "店舗外業務" && row.startTime && row.endTime)
        .slice()
        .sort((a, b) => {
          const startCompare = (a.startTime || "99:99").localeCompare(b.startTime || "99:99");
          if (startCompare !== 0) return startCompare;
          return a.name.localeCompare(b.name, "ja");
        });

            <div class="attendance-time-casts">${groupRows.map(attendanceCard).join("")}</div>
          </section>
        `).join("");
        return;
      }

      attendanceList.innerHTML = rows.map(attendanceCard).join("");
    }

    function renderDepartureSchedule() {
      const now = new Date();
      const eligibleRows = shiftRows
        .filter((row) =>
          row.status !== "店舗外業務"
          && row.status !== "欠勤"
          && row.status !== "無欠"
          && row.endTime
        )
        .slice()
        .sort((a, b) => {
          const endCompare = a.endTime.localeCompare(b.endTime);
          if (endCompare !== 0) return endCompare;
          return a.name.localeCompare(b.name, "ja");
        });

      if (eligibleRows.length === 0) {
        departureScheduleList.innerHTML = `<p class="empty">退勤予定のキャストはいません。</p>`;
        return;
      }

      const groups = new Map();
      eligibleRows.forEach((row) => {
        if (!groups.has(row.endTime)) groups.set(row.endTime, []);
        groups.get(row.endTime).push(row);
      });

      const departureCardClass = (row) => {
        if (row.status === "退勤") return " is-departed";
        let endMinutes = minutesFromTime(row.endTime);
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        if (endMinutes <= 6 * 60 && nowMinutes >= 12 * 60) endMinutes += 24 * 60;
        if (endMinutes >= 12 * 60 && nowMinutes <= 6 * 60) endMinutes -= 24 * 60;
        const remainingMinutes = endMinutes - nowMinutes;
        if (remainingMinutes <= 0) return " is-departure-overdue";
        if (remainingMinutes <= 30) return " is-departing-soon";
        return "";
      };

      departureScheduleList.innerHTML = Array.from(groups.entries()).map(([time, rows]) => `
        <section class="attendance-time-group" aria-label="${escapeHtml(time)} 退勤予定">
          <div class="attendance-time-label">${escapeHtml(time)}</div>
          <div class="attendance-time-casts">
            ${rows.map((row) => `<div class="departure-schedule-card${departureCardClass(row)}">${escapeHtml(row.name)}</div>`).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderBreakManagement() {
      const eligibleRows = shiftRows
        .map((row) => ({
          ...row,
          effectiveBreakPlan: row.breakPlan || calculateBreakPlan(row.startTime, row.endTime)
        }))
        .filter((row) => row.status !== "店舗外業務" && ["60", "45"].includes(String(row.effectiveBreakPlan)))
        .sort((a, b) => {
          const startCompare = (a.startTime || "99:99").localeCompare(b.startTime || "99:99");
          if (startCompare !== 0) return startCompare;
          return a.name.localeCompare(b.name, "ja");
        });

      breakManagementList.innerHTML = ["60", "45"].map((minutes) => {
        const rows = eligibleRows.filter((row) => String(row.effectiveBreakPlan) === minutes);
        if (rows.length === 0) return "";
        return `
          <section class="break-management-group" aria-label="${minutes}分休憩">
            <div class="break-management-label">${minutes}分</div>
            ${rows.map((row) => {
              const stateClass = row.breakUsed
                ? " is-break-done"
                : row.status === "休憩中"
                  ? " is-on-break"
                  : "";
              const breakEndLabel = row.status === "休憩中" && row.breakEndTime
                ? `(${escapeHtml(row.breakEndTime)})`
                : "";
              return `<div class="break-management-card${stateClass}">${escapeHtml(row.name)}${breakEndLabel}</div>`;
            }).join("")}
          </section>
        `;
      }).join("") || `<p class="empty">休憩対象のキャストはいません。</p>`;
    }

    function clearAttendanceStatusDropTargets() {
      attendanceStatusDropZones.querySelectorAll(".is-dragover").forEach((zone) => zone.classList.remove("is-dragover"));
    }

    function clearAttendanceSalesDropTargets() {
      attendanceSalesDropZones.querySelectorAll(".is-dragover").forEach((zone) => zone.classList.remove("is-dragover"));
    }

    function clearAttendanceWorkingStatusDropTargets() {
      attendanceWorkingStatusDropZones.querySelectorAll(".is-dragover").forEach((zone) => zone.classList.remove("is-dragover"));

    function workingAttendanceTransitionAllowed(row, status) {
      if (!row || ["欠勤", "無欠", "退勤", "店舗外業務"].includes(row.status)) return false;
      if (!row.hasCheckedIn) return false;
      if (row.status === "休憩中") return status === "休憩済み";
      if (row.breakUsed) return status === "退勤";
      const breakPlan = String(row.breakPlan || calculateBreakPlan(row.startTime, row.endTime));
      if (breakPlan === "45" || breakPlan === "60") {
        return status === "休憩中" || status === "退勤";
      }
      return status === "退勤";
    }

    function applyWorkingAttendanceStatus(row, status) {
      if (!row) return;
      if (status === "休憩中") {
        const plannedMinutes = Number(row.breakPlan);
        const breakMinutes = Number.isFinite(plannedMinutes) && plannedMinutes > 0 ? plannedMinutes : 45;
        row.status = "休憩中";
        row.breakEndTime = formatClockTime(new Date(Date.now() + breakMinutes * 60 * 1000));
      }
      if (status === "休憩済み") {
        row.status = "出勤中";
        row.breakUsed = true;
        row.breakEndTime = "";
      }
      if (status === "退勤") {
        row.status = "退勤";
        row.breakEndTime = "";
        row.lateEditing = false;
      }
      renderShiftTable();
    }

    function draggedShiftRow(dataTransfer) {
      let dragData = null;
      try {
        dragData = JSON.parse(dataTransfer.getData("application/x-akibaguild-cast"));
      } catch (error) {
        dragData = null;
      }
      if (dragData?.id) {
        const rowById = shiftRows.find((item) => item.id === dragData.id);
        if (rowById) return rowById;
      }
      const draggedName = dataTransfer.getData("text/plain").trim();
      return shiftRows.find((item) => item.name === draggedName) || null;
    }

    function tableCellEntriesFor(slotKey, columnIndex) {
      const names = (tableSheetValues.get(tableCellKey(slotKey, columnIndex, "name")) || "").split("\n").filter(Boolean);
      const minutes = (tableSheetValues.get(tableCellKey(slotKey, columnIndex, "minute")) || "").split("\n").filter(Boolean);
      const statuses = (tableSheetValues.get(tableCellKey(slotKey, columnIndex, "status")) || "").split("\n");
      return names.map((name, index) => ({
        name,
        minute: minutes[index] || "00",
        status: tableStatusOptions.includes(statuses[index]) ? statuses[index] : "ディーラー"
      }));
    }

    function readTableCellEntries(cell) {
      return tableCellEntriesFor(cell.dataset.tableSlot, cell.dataset.tableColumn);
    }

    function tableNameDisplay(entries) {
      return entries.map((entry) => {
        const escapedName = escapeHtml(entry.name);
        if (entry.status === "先生") return `(${escapedName})`;
        if (entry.status === "指名") return `<span class="table-name-nomination">${escapedName}</span>`;
        return escapedName;
      }).join("<br>");
    }

    function tableMinuteDisplay(entries) {
      return entries.map((entry) => {
        const escapedMinute = escapeHtml(entry.minute);
        return entry.status === "指名"
          ? `<span class="table-minute-nomination">${escapedMinute}</span>`
          : escapedMinute;
      }).join("<br>");
    }

    function tableCellEditorRow(entry, index, minuteOptions) {

          <select data-table-entry-minute aria-label="分 ${index + 1}">
            ${minuteOptions.map((minute) => `<option value="${minute}" ${entry.minute === minute ? "selected" : ""}>${minute}</option>`).join("")}
          </select>
          <select data-table-entry-status aria-label="状態 ${index + 1}">
            ${tableStatusOptions.map((status) => `<option value="${status}" ${entry.status === status ? "selected" : ""}>${status}</option>`).join("")}
          </select>
          <button class="ghost-btn danger-btn" type="button" data-table-cell-action="remove">削除</button>
        </div>
      `;
    }

    function renderTableCellEditorRows() {
      if (!pendingTableCellEdit) return;

        ? pendingTableCellEdit.entries.map((entry, index) => tableCellEditorRow(entry, index, pendingTableCellEdit.minuteOptions)).join("")

    function syncTableCellEditorRows() {

      }));

    function openTableCellPanel(cell, castName = "") {
      const slotMinute = Number(cell.dataset.tableSlot) % 60;
      const minuteOptions = slotMinute === 30
        ? tableMinuteOptions.slice(6)
        : tableMinuteOptions.slice(0, 6);
      const entries = readTableCellEntries(cell);
      selectTableCellPair(cell);
      if (castName && !entries.some((entry) => entry.name === castName)) {
        entries.push({ name: castName, minute: minuteOptions[0], status: "ディーラー" });
      }
      const slotLabel = minutesToClock(Number(cell.dataset.tableSlot));
      const columnLabel = tableColumnLabels[Number(cell.dataset.tableColumn)].replace("\n", " / ");
      pendingTableCellEdit = { cell, entries, minuteOptions };
      tableDropPanel.classList.add("active");
      tableDropPanel.innerHTML = `
        <div class="shift-modal" role="dialog" aria-modal="true" aria-labelledby="tableCellEditorTitle">
          <h3 id="tableCellEditorTitle">管理セル設定</h3>
          <p class="subtle">${escapeHtml(slotLabel)}・${escapeHtml(columnLabel)}の登録内容を設定します。</p>
          <div class="table-cell-editor-head" aria-hidden="true">
            <span>名前</span><span>時間(分)</span><span>状態</span><span>消去</span>
          </div>
          <div id="tableCellEditorList" class="table-cell-editor-list"></div>
          <div class="shift-form-actions">
            <button class="action-btn" type="button" data-table-cell-action="add">項目を追加</button>
            <button class="action-btn primary-action" type="button" data-table-cell-action="save">保存</button>
            <button class="action-btn" type="button" data-table-cell-action="back">戻る</button>
          </div>
        </div>

    function closeTableCellPanel() {
      pendingTableCellEdit = null;
      tableSheet.querySelectorAll(".is-selected").forEach((cell) => cell.classList.remove("is-selected"));
      tableDropPanel.classList.remove("active");
      tableDropPanel.innerHTML = "";
    }

    function tableCellKey(slotKey, columnIndex, field) {
      return `${slotKey}-${columnIndex}-${field}`;
    }

    function setTableCellEntries(cell, entries) {
      const slotKey = cell.dataset.tableSlot;
      const columnIndex = cell.dataset.tableColumn;
      const nameKey = tableCellKey(slotKey, columnIndex, "name");
      const minuteKey = tableCellKey(slotKey, columnIndex, "minute");
      const statusKey = tableCellKey(slotKey, columnIndex, "status");
      const nameCell = tableSheet.querySelector(`[data-table-slot="${slotKey}"][data-table-column="${columnIndex}"][data-table-field="name"]`);
      const minuteCell = tableSheet.querySelector(`[data-table-slot="${slotKey}"][data-table-column="${columnIndex}"][data-table-field="minute"]`);
      const nextNames = entries.map((entry) => entry.name).join("\n");
      const nextMinutes = entries.map((entry) => entry.minute).join("\n");
      const nextStatuses = entries.map((entry) => entry.status || "ディーラー").join("\n");
      const hasNomination = entries.some((entry) => entry.status === "指名");
      if (nameCell) {
        nameCell.innerHTML = tableNameDisplay(entries);
        nameCell.classList.toggle("has-nomination", hasNomination);
      }
      if (minuteCell) minuteCell.innerHTML = tableMinuteDisplay(entries);
      if (minuteCell) minuteCell.classList.toggle("has-nomination", hasNomination);
      tableSheetValues.set(nameKey, nextNames);
      tableSheetValues.set(minuteKey, nextMinutes);
      tableSheetValues.set(statusKey, nextStatuses);
    }

    function nominationExactMinute(cell, minute) {
      const slot = Number(cell.dataset.tableSlot);
      return Math.floor(slot / 60) * 60 + Number(minute || 0);
    }

    function addNominationToExactMinute(columnIndex, exactMinute, entry) {
      const targetSlot = String(Math.floor(exactMinute / 30) * 30);
      const targetMinute = String(((exactMinute % 60) + 60) % 60).padStart(2, "0");
      const targetEntries = tableCellEntriesFor(targetSlot, columnIndex);
      const nextEntry = { name: entry.name, minute: targetMinute, status: "指名" };
      const exists = targetEntries.some((item) => (
        item.name === nextEntry.name && item.minute === nextEntry.minute && item.status === "指名"
      ));
      if (!exists) targetEntries.push(nextEntry);
      const targetCell = tableSheet.querySelector(
        `[data-table-slot="${targetSlot}"][data-table-column="${columnIndex}"][data-table-field="name"]`
      ) || { dataset: { tableSlot: targetSlot, tableColumn: String(columnIndex) } };
      setTableCellEntries(targetCell, targetEntries);
    }

    function createNominationSession(cell, entry) {
      const columnIndex = Number(cell.dataset.tableColumn);
      const firstExactMinute = nominationExactMinute(cell, entry.minute);
      const tableName = tableColumnLabels[columnIndex].replace("\n", " / ");
      nominationSessions.unshift({
        id: `nomination-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        name: entry.name,
        tableName,
        columnIndex,
        count: 1,
        endsAt: Date.now() + 30 * 60 * 1000,
        lastExactMinute: firstExactMinute,
        active: true
      });
    }

    function registerNewNominationSessions(cell, previousEntries, nextEntries) {
      nextEntries.filter((entry) => entry.status === "指名").forEach((entry) => {
        const alreadyExisted = previousEntries.some((previous) => (
          previous.name === entry.name && previous.minute === entry.minute && previous.status === "指名"
        ));
        if (!alreadyExisted) createNominationSession(cell, entry);
      });
      renderSideShareList();
    }

    function continueNominationSession(session) {
      session.count += 1;
      session.endsAt = Math.max(session.endsAt, Date.now()) + 30 * 60 * 1000;
      session.lastExactMinute += 30;
      addNominationToExactMinute(session.columnIndex, session.lastExactMinute, {
        name: session.name,
        status: "指名"
      });
      renderSideShareList();
    }

    function clearTableDropTarget() {
      tableSheet.querySelectorAll(".drop-target").forEach((cell) => cell.classList.remove("drop-target"));
    }

    function tableCellPair(cell) {
      if (!cell) return [];
      const slotKey = cell.dataset.tableSlot;
      const columnIndex = cell.dataset.tableColumn;
      return Array.from(tableSheet.querySelectorAll(
        `[data-table-slot="${slotKey}"][data-table-column="${columnIndex}"]`
      ));
    }

    function selectTableCellPair(cell) {
      tableSheet.querySelectorAll(".is-selected").forEach((item) => item.classList.remove("is-selected"));
      tableCellPair(cell).forEach((item) => item.classList.add("is-selected"));
    }

    function markTableDropPair(cell) {
      clearTableDropTarget();
      tableCellPair(cell).forEach((item) => item.classList.add("drop-target"));
    }

    function updateCurrentTimeLine() {
      const line = document.querySelector("#tableCurrentTimeLine");
      if (!line) return;
      const rows = Array.from(tableSheet.querySelectorAll("[data-table-time-row]"));
      if (rows.length === 0) {
        line.hidden = true;
        return;
      }

      const now = new Date();
      const firstSlot = Number(rows[0].dataset.tableTimeRow);
      const lastSlot = Number(rows[rows.length - 1].dataset.tableTimeRow);
      let currentMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      if (lastSlot >= 24 * 60 && currentMinutes < firstSlot) currentMinutes += 24 * 60;
      const activeRow = rows.find((row) => {
        const slot = Number(row.dataset.tableTimeRow);
        return currentMinutes >= slot && currentMinutes < slot + 30;
      });

      if (!activeRow) {
        line.hidden = true;
        return;
      }

      line.hidden = false;
      line.style.top = `${activeRow.offsetTop + activeRow.offsetHeight}px`;
      line.dataset.currentTime = now.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    }

    function renderTableSheet() {
      const timeSlots = tableTimeSlots();
      const headerCells = [
        `<div class="table-sheet-corner" aria-hidden="true"></div>`,
        ...tableColumnLabels.map((label) => `<div class="table-sheet-col table-sheet-col-group">${label}</div>`)
      ];

      if (timeSlots.length === 0) {
        tableSheet.innerHTML = `<div class="table-sheet-empty">シフトの出勤時間と退勤時間から営業時間を作成します。</div>`;
        return;
      }

      const bodyCells = timeSlots.flatMap((slot) => {
        const hourBoundaryClass = Number(slot.key) % 60 === 0 ? " hour-boundary" : "";
        return [
        `<div class="table-sheet-row${hourBoundaryClass}" data-table-time-row="${slot.key}">${slot.label}</div>`,
        ...tableColumnLabels.flatMap((columnLabel, columnIndex) => (
          tableFieldLabels.map((field) => {
            const cellKey = tableCellKey(slot.key, columnIndex, field.id);
            const value = tableSheetValues.get(cellKey) || "";
            const entries = tableCellEntriesFor(slot.key, columnIndex);
            const hasNomination = entries.some((entry) => entry.status === "指名");
            const displayValue = field.id === "name" ? tableNameDisplay(entries) : tableMinuteDisplay(entries);
            return `
              <button
                type="button"
                class="table-sheet-cell${hourBoundaryClass}${hasNomination ? " has-nomination" : ""}"
                aria-label="${slot.label} ${columnLabel} ${field.label}"
                data-table-slot="${slot.key}"
                data-table-column="${columnIndex}"
                data-table-field="${field.id}"
              >${displayValue}</button>
            `;
          })
        ))
        ];
      });

      tableSheet.innerHTML = [
        ...headerCells,
        ...bodyCells,
        `<div id="tableCurrentTimeLine" class="table-current-time-line" hidden></div>`
      ].join("");
      updateCurrentTimeLine();
    }

    function formatYen(value) {
      return yen.format(Math.max(0, value));
    }

    function currentTotals() {
      const subtotal = Array.from(cart.values()).reduce((sum, item) => sum + item.price * item.qty, 0);
      const tax = Math.floor(subtotal * 0.1);
      const discount = Number(discountInput.value || 0);
      const total = Math.max(0, subtotal + tax - discount);
      const received = Number(receivedInput.value || 0);
      const change = Math.max(0, received - total);
      const count = Array.from(cart.values()).reduce((sum, item) => sum + item.qty, 0);
      return { subtotal, tax, discount, total, received, change, count };
    }

    function renderProducts() {
      const query = searchBox.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const visibleProducts = products.filter((product) => {
        const matchesCategory = category === "all" || product.category === category;
        const matchesQuery = product.name.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      productGrid.innerHTML = visibleProducts.map((product) => `

    function formatShiftWeekday(dateValue) {
      const date = new Date(`${dateValue}T00:00:00`);
      return ["日", "月", "火", "水", "木", "金", "土"][date.getDay()] || "";
    }

    function clockToDecimalTime(value) {
      const minutes = timeToMinutes(value);
      if (minutes === null) return "";
      return String(Number((minutes / 60).toFixed(2)));
    }

    function decimalTimeToClock(value) {
      if (value === "") return "";
      const decimal = Number(value);
      if (!Number.isFinite(decimal) || decimal < 0 || decimal >= 24) return "";
      const quarterHours = Math.round(decimal * 4);
      if (Math.abs(decimal * 4 - quarterHours) > 0.001) return "";
      return minutesToClock(quarterHours * 15);
    }

    function isTimeWithinShiftRequirement(value, requiredStartTime, requiredEndTime) {
      if (!value || !requiredStartTime || !requiredEndTime) return true;
      const valueMinutes = timeToMinutes(value);
      const startMinutes = timeToMinutes(requiredStartTime);
      const endMinutes = timeToMinutes(requiredEndTime);
      if (valueMinutes === null || startMinutes === null || endMinutes === null) return false;
      if (startMinutes <= endMinutes) return valueMinutes >= startMinutes && valueMinutes <= endMinutes;
      return valueMinutes >= startMinutes || valueMinutes <= endMinutes;
    }

    async function saveCastShiftEntry(requestId) {
      const request = findShiftRequest(requestId);
      const employeeNumber = currentLoginAccount?.employeeNumber || "";
      if (!request || !employeeNumber) return;
      if (!request.dailySubmissions) request.dailySubmissions = {};
      if (!request.dailySubmissionStatuses) request.dailySubmissionStatuses = {};
      let inputCount = 0;
      const rows = Array.from(document.querySelectorAll("[data-cast-shift-entry-row]"));
      const normalizedRows = [];
      for (const row of rows) {
        const startValue = row.querySelector('[data-cast-shift-field="startTime"]')?.value || "";
        const endValue = row.querySelector('[data-cast-shift-field="endTime"]')?.value || "";
        const startTime = decimalTimeToClock(startValue);
        const endTime = decimalTimeToClock(endValue);
        const requiredStartTime = row.dataset.requiredStart || "";
        const requiredEndTime = row.dataset.requiredEnd || "";
        if ((startValue && !startTime) || (endValue && !endTime)) {
          window.alert(`${formatDisplayDate(row.dataset.shiftDate)}は15分単位（.00、.25、.5、.75）で入力してください。`);
          return;
        }
        if ((startTime && !endTime) || (!startTime && endTime)) {
          window.alert(`${formatDisplayDate(row.dataset.shiftDate)}の出勤と退勤を両方入力してください。`);
          return;
        }
        if ((startTime && !isTimeWithinShiftRequirement(startTime, requiredStartTime, requiredEndTime))
          || (endTime && !isTimeWithinShiftRequirement(endTime, requiredStartTime, requiredEndTime))) {
          window.alert(`${formatDisplayDate(row.dataset.shiftDate)}の時刻がシフト要求時間外です。`);
          return;
        }
        normalizedRows.push({ row, startTime, endTime });
      }
      normalizedRows.forEach(({ row, startTime, endTime }) => {
        if (!request.dailySubmissions[row.dataset.shiftDate]) request.dailySubmissions[row.dataset.shiftDate] = {};
        request.dailySubmissions[row.dataset.shiftDate][employeeNumber] = { startTime, endTime };
        if (!request.dailySubmissionStatuses[row.dataset.shiftDate]) request.dailySubmissionStatuses[row.dataset.shiftDate] = {};
        const status = startTime && endTime ? "提出済み" : "未入力";
        request.dailySubmissionStatuses[row.dataset.shiftDate][employeeNumber] = status;
        if (status === "提出済み") inputCount += 1;
      });
      if (!request.submissionStatuses) request.submissionStatuses = {};
      request.submissionStatuses[employeeNumber] = inputCount > 0 ? "提出済み" : "未提出";
      request.submittedAt = request.submittedAt || {};
      request.submittedAt[employeeNumber] = new Date().toISOString();
      const savedToServer = await persistShiftRequest(request);
      renderCastShiftEntry(
        requestId,
        savedToServer ? "入力したシフトをサーバーへ保存しました。" : "入力したシフトをこのブラウザへ保存しました。"
      );
    }

    function shiftRequestPeriodDates(request) {
      if (!request?.startDate || !request?.endDate || request.startDate > request.endDate) return [];
      const dates = [];
      const current = new Date(`${request.startDate}T00:00:00`);
      const end = new Date(`${request.endDate}T00:00:00`);
      while (current <= end && dates.length < 93) {
        dates.push(
          `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, "0")}-${String(current.getDate()).padStart(2, "0")}`
        );
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    function dailyShiftSubmissionStatus(request, date, employeeNumber) {
      return request.dailySubmissionStatuses?.[date]?.[employeeNumber]
        || shiftRequestSubmissionStatus(request, employeeNumber);
    }

    function adjustShiftBuilderTime(button) {
      const row = button.closest("[data-shift-builder-row]");
      const field = button.dataset.shiftTimeAdjust;
      const input = row?.querySelector(`[data-shift-assignment-field="${field}"]`);
      if (!input) return;
      const currentMinutes = timeToMinutes(input.value);
      if (currentMinutes === null) return;
      const adjustedMinutes = (currentMinutes + Number(button.dataset.adjustMinutes) + 24 * 60) % (24 * 60);
      const startInput = row.querySelector('[data-shift-assignment-field="startTime"]');
      const endInput = row.querySelector('[data-shift-assignment-field="endTime"]');
      const currentStart = timeToMinutes(startInput?.value);
      const currentEnd = timeToMinutes(endInput?.value);
      if (currentStart !== null && currentEnd !== null) {
        const currentDuration = (currentEnd - currentStart + 24 * 60) % (24 * 60);
        const nextStart = field === "startTime" ? adjustedMinutes : currentStart;
        const nextEnd = field === "endTime" ? adjustedMinutes : currentEnd;
        const nextDuration = (nextEnd - nextStart + 24 * 60) % (24 * 60);
        if (nextDuration === 0 || nextDuration >= currentDuration) return;
      }
      input.value = minutesToClock(adjustedMinutes);
    }

    async function saveShiftRequest() {
      const title = document.querySelector("#shiftRequestTitle")?.value.trim() || "";
      const startDate = document.querySelector("#shiftRequestStartDate")?.value || "";
      const endDate = document.querySelector("#shiftRequestEndDate")?.value || "";
      const deadline = document.querySelector("#shiftRequestDeadline")?.value || "";
      const message = document.querySelector("#shiftRequestMessage");
      if (!title || !startDate || !endDate || !deadline) {
        if (message) message.textContent = "タイトル、シフト期間、提出期限をすべて設定してください。";
        return;
      }
      if (startDate > endDate) {
        if (message) message.textContent = "シフト期間の終了日は開始日以降に設定してください。";
        return;
      }
      const request = {
        id: `shift-request-${Date.now()}`,
        title,
        startDate,
        endDate,
        deadline,
        assignedEmployeeNumbers: [],
        submissionStatuses: {},
        dailySettings: {},
        scheduleAssignments: {},
        published: false,
        createdAt: new Date().toISOString()
      };
      let savedToServer = false;
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        try {
          const response = await fetch("/api/records/shift_requests", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              businessDate: startDate,
              payload: request,
              actor: currentLoginAccount?.employeeNumber || "",
              terminal: document.querySelector("#terminalSelect")?.value || ""
            })
          });
          if (!response.ok) throw new Error("shift_request_save_failed");
          const record = await response.json();
          request.recordId = record.id;
          savedToServer = true;
        } catch (error) {
          savedToServer = false;
        }
      }
      shiftRequests.unshift(request);
      saveShiftRequestsLocally();
      renderShiftManagement();
      const savedMessage = document.querySelector("#shiftRequestMessage");
      if (savedMessage) {
        savedMessage.textContent = savedToServer
          ? "シフト設定をサーバーへ保存しました。"
          : "シフト設定をこのブラウザへ保存しました。";
      }
    }

    async function persistShiftRequest(request) {
      saveShiftRequestsLocally();
      if (!request.recordId || (window.location.protocol !== "http:" && window.location.protocol !== "https:")) {
        return false;
      }
      try {
        const payload = { ...request };
        delete payload.recordId;
        const response = await fetch(`/api/records/shift_requests/${request.recordId}`, {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            businessDate: request.startDate,
            payload,
            actor: currentLoginAccount?.employeeNumber || "",
            terminal: document.querySelector("#terminalSelect")?.value || ""
          })
        });
        return response.ok;
      } catch (error) {
        return false;
      }
    }

      if (!request) return;
      if (!Array.isArray(request.assignedEmployeeNumbers)) request.assignedEmployeeNumbers = [];
      if (!request.assignedEmployeeNumbers.includes(employeeNumber)) {
        request.assignedEmployeeNumbers.push(employeeNumber);
      }
      if (!request.submissionStatuses) request.submissionStatuses = {};
      if (!request.submissionStatuses[employeeNumber]) request.submissionStatuses[employeeNumber] = "未提出";
      await persistShiftRequest(request);
      const account = loginAccounts.find((item) => item.employeeNumber === employeeNumber);
      renderShiftRequestDetail(requestId, `${account?.castName || employeeNumber}へシフト申請を依頼しました。`);

    async function saveAccountEditor() {
      const castName = document.querySelector("#accountCastName")?.value.trim() || "";
      const employeeNumber = document.querySelector("#accountEmployeeNumber")?.value.trim() || "";
      const password = document.querySelector("#accountPassword")?.value || "";
      const role = document.querySelector("#accountRole")?.value || "キャスト";
      const message = document.querySelector("#accountEditorMessage");
      if (!castName || !employeeNumber || !password) {
        if (message) message.textContent = "キャスト名、従業員番号、パスワードを入力してください。";
        return;
      }
      const duplicate = loginAccounts.some((item) => (
        item.employeeNumber === employeeNumber && item.employeeNumber !== editingAccountEmployeeNumber
      ));
      if (duplicate) {
        if (message) message.textContent = "同じ従業員番号のアカウントが登録されています。";
        return;
      }
      const existing = loginAccounts.find((item) => item.employeeNumber === editingAccountEmployeeNumber);
      if (existing && !canEditAccount(existing)) {
        if (message) message.textContent = `${existing.role}のアカウントを編集する権限がありません。`;
        return;
      }
      if (!editableAccountRoles().includes(role)) {
        if (message) message.textContent = `${role}へ変更する権限がありません。`;
        return;
      }
      if (existing) {
        existing.castName = castName;
        existing.employeeNumber = employeeNumber;
        existing.password = password;
        existing.role = role;
      } else {
        loginAccounts.push({ castName, employeeNumber, password, role });
      }
      const saveResult = await saveLoginAccounts();
      accountManagementNotice = saveResult === "server"
        ? `${castName}（${employeeNumber}）をサーバーへ保存しました。`
        : saveResult === "local"
          ? `${castName}（${employeeNumber}）をこのブラウザへ保存しました。`
          : "保存に失敗しました。ブラウザの保存設定を確認してください。";
      renderAccountManagement();
    }

    async function saveLoginAccounts() {
      let localSaved = false;
      try {
        localStorage.setItem(loginAccountStorageKey, JSON.stringify(loginAccounts));
        localSaved = true;
      } catch (error) {
        localSaved = false;
      }
      if (window.location.protocol === "http:" || window.location.protocol === "https:") {
        try {
          const response = await fetch("/api/accounts", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              accounts: loginAccounts,
              actor: currentLoginAccount?.employeeNumber || "",
              terminal: document.querySelector("#terminalSelect")?.value || ""
            })
          });
          if (!response.ok) throw new Error("account_server_save_failed");
          const result = await response.json();
          loginAccounts.splice(0, loginAccounts.length, ...result.accounts);
          localStorage.setItem(loginAccountServerMigrationKey, "1");
          accountServerAvailable = true;
          return "server";
        } catch (error) {
          accountServerAvailable = false;
        }
      }
      return localSaved ? "local" : "failed";
    }

    async function synchronizeLoginAccountsWithServer() {
      if (window.location.protocol !== "http:" && window.location.protocol !== "https:") return;
      try {
        const hasLocalAccounts = Boolean(localStorage.getItem(loginAccountStorageKey));
        const migrationCompleted = localStorage.getItem(loginAccountServerMigrationKey) === "1";
        if (hasLocalAccounts && !migrationCompleted) {
          await saveLoginAccounts();
          return;
        }
        const response = await fetch("/api/accounts", { headers: { accept: "application/json" } });
        if (!response.ok) throw new Error("account_server_load_failed");
        const result = await response.json();
        if (!Array.isArray(result.accounts) || result.accounts.length === 0) return;
        loginAccounts.splice(0, loginAccounts.length, ...result.accounts);
        localStorage.setItem(loginAccountStorageKey, JSON.stringify(loginAccounts));
        localStorage.setItem(loginAccountServerMigrationKey, "1");
        accountServerAvailable = true;
      } catch (error) {
        accountServerAvailable = false;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;");
    }

    function generateShiftId() {
      return `shift-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function timeToMinutes(time) {
      if (!time || !time.includes(":")) return null;
      const [hours, minutes] = time.split(":").map(Number);
      if (Number.isNaN(hours) || Number.isNaN(minutes)) return null;
      return hours * 60 + minutes;
    }

    function calculateBreakPlan(startTime, endTime) {
      const startMinutes = timeToMinutes(startTime);
      let endMinutes = timeToMinutes(endTime);
      if (startMinutes === null || endMinutes === null) return "なし";
      if (endMinutes < startMinutes) endMinutes += 24 * 60;
      const workMinutes = endMinutes - startMinutes;

      if (workMinutes <= 6 * 60) return "なし";
      if (workMinutes <= 8 * 60) return "45";
      return "60";
    }

    function normalizeSpreadsheetTime(value) {
      const cleaned = String(value || "")
        .trim()
        .replace(/[（）()]/g, "")
        .replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xFEE0))
        .replace(/[．。]/g, ".");

      if (!cleaned) return "";
      if (cleaned.includes(":")) {
        const [hour, minute = "00"] = cleaned.split(":");
        return `${String(Number(hour)).padStart(2, "0")}:${String(Number(minute)).padStart(2, "0")}`;
      }

      const numericTime = Number(cleaned);
      if (Number.isNaN(numericTime)) return "";
      const hour = Math.floor(numericTime);
      const minute = Math.round((numericTime - hour) * 60);
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function defaultShiftRow(data = {}) {
      const startTime = data.startTime || "";
      const endTime = data.endTime || "";
      const status = data.status || "出勤予定";
      const isOutsideWork = Boolean(data.isOutsideWork) || status === "店舗外業務";
      return {
        id: data.id || generateShiftId(),
        name: data.name || "キャスト名",
        employeeNumber: data.employeeNumber || "",
        startTime,
        endTime,
        memo: data.memo || "",
        status,
        isOutsideWork,
        breakPlan: isOutsideWork ? "なし" : calculateBreakPlan(startTime, endTime),
        breakUsed: Boolean(data.breakUsed),
        hasCheckedIn: Boolean(data.hasCheckedIn) || ["出勤中", "休憩中", "退勤"].includes(status),
        breakEndTime: data.breakEndTime || "",
        lateTime: data.lateTime || "",
        lateEditing: Boolean(data.lateEditing)
      };
    }
