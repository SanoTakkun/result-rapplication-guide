    function todayIsoDate() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function minutesFromTime(time) {
      const value = timeToMinutes(time);
      return value === null ? -1 : value;
    }

    function shareScheduleLabel(item) {
      if (item.repeatMode === "weekdays") {
        return `曜日 ${item.weekdayLabels.join("・")} / 通知時間 ${item.notifyTime || "--:--"}`;
      }
      return `日付 ${item.date || "未設定"} / 通知時間 ${item.notifyTime || "--:--"}`;
    }

    function shouldShowShareItem(item, now = new Date()) {
      if (!item.notifyTime) return false;
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const notifyMinutes = minutesFromTime(item.notifyTime);
      if (notifyMinutes < 0 || nowMinutes < notifyMinutes) return false;

      if (item.repeatMode === "weekdays") {
        return item.weekdays.includes(now.getDay());
      }

      return item.date === todayIsoDate();
    }

    function updateDepartureNotifications(now = new Date()) {
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const groups = new Map();
      shiftRows
        .filter((row) =>
          row.status !== "店舗外業務"
          && row.status !== "欠勤"
          && row.status !== "無欠"
          && row.endTime
        )
        .forEach((row) => {
          if (!groups.has(row.endTime)) groups.set(row.endTime, []);
          groups.get(row.endTime).push(row.name);
        });

      groups.forEach((names, endTime) => {
        const endMinutes = minutesFromTime(endTime);
        if (endMinutes < 0) return;
        const minutesUntilDeparture = (endMinutes - nowMinutes + 24 * 60) % (24 * 60);
        if (minutesUntilDeparture > 30 || minutesUntilDeparture === 0) return;
        const key = `${todayIsoDate()}-${endTime}`;
        if (dismissedDepartureNotificationKeys.has(key)) return;
        const sortedNames = names.slice().sort((a, b) => a.localeCompare(b, "ja"));
        const existing = departureNotifications.find((item) => item.key === key);
        if (existing) {
          existing.names = sortedNames;
          return;
        }
        departureNotifications.unshift({
          id: `departure-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          key,
          endTime,
          names: sortedNames
        });
      });
    }

    function renderSideShareList() {
      const now = new Date();
      updateDepartureNotifications(now);
      const notifiedItems = shareItems.filter((item) => shouldShowShareItem(item, now));
      const activeNominations = nominationSessions.filter((session) => session.active);

      if (notifiedItems.length === 0 && activeNominations.length === 0 && departureNotifications.length === 0) {
        sideShareList.innerHTML = `<p class="empty">通知対象の共有情報はありません。</p>`;
        return;

      const departureCards = departureNotifications.map((notification) => `

          <div class="share-item-title">退勤時刻　${escapeHtml(notification.endTime.replace(":", "："))}</div>

            <button class="action-btn primary-action" type="button" data-departure-notification-action="ok" data-departure-notification-id="${escapeHtml(notification.id)}">OK</button>
          </div>
        </article>
      `).join("");

      const nominationCards = activeNominations.map((session) => {
        const remainingMilliseconds = Math.max(0, session.endsAt - Date.now());
        const remainingMinutes = Math.ceil(remainingMilliseconds / 60000);
        const isAlert = remainingMilliseconds <= 10 * 60 * 1000;
        return `
          <article class="share-item nomination-share-item${isAlert ? " nomination-alert" : ""}">
            <div class="nomination-share-title">指名(${escapeHtml(session.name)}/${escapeHtml(session.tableName)})</div>
            <div class="nomination-share-count">${session.count}回目</div>
            <div class="nomination-share-remaining${isAlert ? " is-alert" : ""}">残り ${remainingMinutes}分${isAlert ? "（10分前通知）" : ""}</div>
            <div class="nomination-share-actions">
              <button class="action-btn primary-action" type="button" data-nomination-action="continue" data-nomination-id="${escapeHtml(session.id)}">継続</button>
              <button class="action-btn danger-btn" type="button" data-nomination-action="end" data-nomination-id="${escapeHtml(session.id)}">終了</button>
            </div>
          </article>
        `;
      }).join("");

      const regularCards = notifiedItems.map((item) => `
        <article class="share-item">
          <div class="share-item-title">${escapeHtml(item.title)}</div>
          <div class="share-item-time">${escapeHtml(shareScheduleLabel(item))}</div>
          <div class="share-item-body">${escapeHtml(item.body)}</div>
        </article>
      `).join("");
      sideShareList.innerHTML = departureCards + nominationCards + regularCards;
    }

        ? `日付: ${activeShareRepeat.dates.join("・")}`

    function handleShareToolAction(action) {
      if (action === "back") {
        closeShareToolPanel();
        return;
      }

      const title = document.querySelector("#shareItemTitle").value.trim();
      const body = document.querySelector("#shareItemBody").value.trim();
      const dateInput = document.querySelector("#shareDate");
      const date = dateInput ? dateInput.value : "";
      const notifyTime = document.querySelector("#shareNotifyTime").value;
      if (!notifyTime || !title || !body) {
        document.querySelector("#shareToolMessage").textContent = "通知時間、タイトル、内容を入力してください。";
        return;
      }

      if (!activeShareRepeat.enabled && !date) {
        document.querySelector("#shareToolMessage").textContent = "日付を入力してください。";
        return;
      }

      if (activeShareRepeat.enabled && activeShareRepeat.mode === "dates" && activeShareRepeat.dates.length === 0) {
        document.querySelector("#shareToolMessage").textContent = "繰り返し設定の日付を1つ以上追加してください。";
        return;
      }

      if (activeShareRepeat.enabled && activeShareRepeat.mode === "weekdays" && activeShareRepeat.weekdays.length === 0) {
        document.querySelector("#shareToolMessage").textContent = "曜日を1つ以上選択してください。";
        return;
      }

      if (activeShareRepeat.enabled && activeShareRepeat.mode === "weekdays") {
        shareItems.unshift({
          date: "",
          notifyTime,
          repeatMode: "weekdays",
          weekdays: [...activeShareRepeat.weekdays],
          weekdayLabels: activeShareRepeat.weekdays.map(weekdayName),
          title,
          body
        });
      } else {
        const dates = activeShareRepeat.enabled
          ? activeShareRepeat.dates
          : [date];
        dates.forEach((shareDate) => {
          shareItems.unshift({
            date: shareDate,
            notifyTime,
            repeatMode: activeShareRepeat.enabled ? "dates" : "off",
            weekdays: [],
            weekdayLabels: [],
            title,
            body
          });
        });
      }
      renderShareList();
      renderSideShareList();
      closeShareToolPanel();
    }

          return `<option value="${value}" ${selectedHour === value ? "selected" : ""}>${value}</option>`;
        }).join("");
        const minuteOptions = ["00", "15", "30", "45"].map((minute) => (
          `<option value="${minute}" ${selectedMinute === minute ? "selected" : ""}>${minute}</option>`
        )).join("");

        return `
          <div class="late-editor">
            <span class="subtle">出勤予定時刻</span>
            <select data-shift-id="${row.id}" data-late-field="hour" aria-label="時">${hourOptions}</select>
            <span>:</span>
            <select data-shift-id="${row.id}" data-late-field="minute" aria-label="分">${minuteOptions}</select>
            ${shiftButton(row.id, "setLate", "設定", true)}
          </div>
        `;
      }

      if (row.status === "出勤予定" || row.status === "遅刻") {
        return `
          <div class="action-group">
            ${shiftButton(row.id, "clockIn", "出勤", true)}
            ${shiftButton(row.id, "late", "遅刻")}
            ${shiftButton(row.id, "absent", "欠勤")}
            ${shiftButton(row.id, "noCall", "無欠")}
          </div>
        `;
      }

      if (row.status === "出勤中") {
        const breakButton = row.breakPlan !== "なし" && !row.breakUsed
          ? shiftButton(row.id, "startBreak", "休憩", true)
          : "";
        const leaveButton = shiftButton(row.id, "clockOut", "退勤", !breakButton);
        return `<div class="action-group">${breakButton}${leaveButton}</div>`;
      }

      if (row.status === "休憩中") {
        return `<div class="action-group">${shiftButton(row.id, "endBreak", "休憩終了", true)}</div>`;
      }

      return `<div class="action-group">${shiftButton(row.id, "change", "変更")}</div>`;
    }

    function renderShiftTable() {
      shiftRows.forEach((row) => {
        if (!row.breakUsed && row.status !== "休憩中" && row.status !== "店舗外業務") {
          row.breakPlan = calculateBreakPlan(row.startTime, row.endTime);
        }
      });
      renderAttendanceList();
      renderTableSheet();

      if (shiftRows.length === 0) {
        shiftTableBody.innerHTML = `<p class="empty">シフトデータがありません。</p>`;
        return;
      }

      const sortField = shiftSortField;
      const secondaryField = sortField === "startTime" ? "endTime" : "startTime";
      const groupedRows = shiftRows
        .slice()
        .sort((a, b) => {
          const primaryCompare = (a[sortField] || "99:99").localeCompare(b[sortField] || "99:99");
          if (primaryCompare !== 0) return primaryCompare;
          const secondaryCompare = (a[secondaryField] || "99:99").localeCompare(b[secondaryField] || "99:99");
          if (secondaryCompare !== 0) return secondaryCompare;
          return a.name.localeCompare(b.name, "ja");
        })
        .reduce((groups, row) => {
          const time = row[sortField] || "時間未設定";
          if (!groups.has(time)) groups.set(time, []);
          groups.get(time).push(row);
          return groups;
        }, new Map());

      shiftTableBody.innerHTML = Array.from(groupedRows.entries()).map(([time, rows]) => `
        <section class="shift-time-group">
          <div class="shift-time-heading">${escapeHtml(time)}</div>
          <div class="shift-time-header">
            <span>キャスト名</span>
            <span>ステータス</span>
            <span>休憩時間</span>
            <span>実行</span>
          </div>
          ${rows.map((row) => {
            const statusText = row.status === "遅刻" && row.lateTime ? `遅刻(${row.lateTime}予定)` : row.status;
            const employeeText = row.employeeNumber ? `（${escapeHtml(row.employeeNumber)}）` : "";
            const rowClass = row.status === "店舗外業務" ? "shift-cast-row outside-work" : "shift-cast-row";
            return `
              <div class="${rowClass}">
                <div class="cast-cell">
                  <strong>${escapeHtml(row.name)}${employeeText}</strong>
                  ${row.memo ? `<span class="cast-meta">備考: ${escapeHtml(row.memo)}</span>` : ""}
                </div>
                <div><span class="status-badge">${statusText}</span></div>
                <div>${renderBreakCell(row)}</div>
                <div>${renderActionCell(row)}</div>
              </div>
            `;
          }).join("")}
        </section>
      `).join("");
    }

    function findShiftRow(rowId) {
      return shiftRows.find((row) => row.id === rowId);
    }

    function updateShiftField(rowId, field, value) {
      const row = findShiftRow(rowId);
      if (!row) return;
      row[field] = value;
      renderShiftTable();
    }

    function showShiftMessage(message) {
      const messageEl = document.querySelector("#shiftToolMessage");
      if (messageEl) messageEl.textContent = message;
    }

    function parseShiftImport(text) {
      return text.split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const parts = line.split(/\t|,/).map((part) => part.trim());
          const rawStartTime = parts[1] || "";
          const rawEndTime = parts[2] || "";
          const isOutsideWork = /[（）()]/.test(`${rawStartTime}${rawEndTime}`);
          const startTime = normalizeSpreadsheetTime(rawStartTime);
          const endTime = normalizeSpreadsheetTime(rawEndTime);
          if (!startTime && !endTime) return null;
          const status = isOutsideWork ? "店舗外業務" : "出勤予定";

          return defaultShiftRow({
            name: parts[0] || "キャスト名",
            employeeNumber: "",
            startTime,
            endTime,
            memo: parts.slice(3).join(" / "),
            status,
            isOutsideWork
          });
        })
        .filter(Boolean);
    }

    function handleShiftToolAction(action) {
      if (action === "back") {
        closeShiftToolPanel();
        return;
      }

      if (action === "import") {
        const importedRows = parseShiftImport(document.querySelector("#shiftImportText").value);
        if (importedRows.length === 0) {
          showShiftMessage("取り込むシフトデータを入力してください。");
          return;
        }
        shiftRows.splice(0, shiftRows.length, ...importedRows);
        renderShiftTable();
        closeShiftToolPanel();
        return;
      }

      if (action === "add") {
        const row = readShiftForm("add");
        shiftRows.push(row);
        renderShiftTable();
        closeShiftToolPanel();
        return;
      }

      if (action === "saveEdit") {
        const rowId = document.querySelector("#editShiftSelect").value;
        const rowIndex = shiftRows.findIndex((row) => row.id === rowId);
        if (rowIndex === -1) return;
        const updatedRow = readShiftForm("edit");
        updatedRow.id = rowId;
        shiftRows[rowIndex] = updatedRow;
        renderShiftTable();
        openShiftTool("edit");
        return;
      }

      if (action === "deleteOne") {
        const rowId = document.querySelector("#editShiftSelect").value;
        const rowIndex = shiftRows.findIndex((row) => row.id === rowId);
        if (rowIndex === -1) return;
        shiftRows.splice(rowIndex, 1);
        renderShiftTable();
        openShiftTool("edit");
        return;
      }

      if (action === "deleteAll") {
        const confirmedOne = document.querySelector("#deleteConfirmOne").checked;
        const confirmedTwo = document.querySelector("#deleteConfirmTwo").checked;
        const employeeNumber = document.querySelector("#deleteEmployeeNumber").value.trim();
        if (!confirmedOne || !confirmedTwo) {
          showShiftMessage("2つの確認にチェックしてください。");
          return;
        }
        if (employeeNumber !== "AG000") {
          showShiftMessage("社員の従業員番号が違います。");
          return;
        }
        shiftRows.splice(0, shiftRows.length);
        renderShiftTable();
        closeShiftToolPanel();
      }
    }

    function handleShiftAction(rowId, action) {
      const row = findShiftRow(rowId);
      if (!row) return;

      if (action === "clockIn") {
        row.status = "出勤中";
        row.hasCheckedIn = true;
        row.lateEditing = false;
      }

      if (action === "late") {
        row.lateEditing = true;
      }

      if (action === "setLate") {
        const hour = document.querySelector(`[data-shift-id="${rowId}"][data-late-field="hour"]`).value;
        const minute = document.querySelector(`[data-shift-id="${rowId}"][data-late-field="minute"]`).value;
        const lateStartTime = `${hour}:${minute}`;
        row.status = "遅刻";
        row.startTime = lateStartTime;
        row.lateTime = lateStartTime;
        row.breakPlan = calculateBreakPlan(row.startTime, row.endTime);
        row.lateEditing = false;
      }

      if (action === "absent") {
        row.status = "欠勤";
        row.lateEditing = false;
      }

      if (action === "noCall") {
        row.status = "無欠";
        row.lateEditing = false;
      }

      if (action === "startBreak" && row.breakPlan !== "なし") {
        const breakMinutes = Number(row.breakPlan);
        const endTime = new Date(Date.now() + breakMinutes * 60 * 1000);
        row.status = "休憩中";
        row.breakEndTime = formatClockTime(endTime);
      }

      if (action === "endBreak") {
        row.status = "出勤中";
        row.breakUsed = true;
        row.breakEndTime = "";
      }

      if (action === "clockOut") {
        row.status = "退勤";
        row.lateEditing = false;
      }

      if (action === "change") {
        row.status = "出勤予定";
        row.breakUsed = false;
        row.hasCheckedIn = false;
        row.breakEndTime = "";
        row.lateTime = "";
        row.lateEditing = false;
      }

      renderShiftTable();
    }

    roleFeatureContent.addEventListener("click", async (event) => {
      const castShiftRowButton = event.target.closest("[data-cast-shift-row-action]");
      if (castShiftRowButton) {
        const row = castShiftRowButton.closest("[data-cast-shift-entry-row]");
        if (!row) return;
        const inputs = row.querySelectorAll("[data-cast-shift-field]");
        const rowAction = castShiftRowButton.dataset.castShiftRowAction;
        if (rowAction === "clear") {
          inputs.forEach((input) => { input.value = ""; });
        }
        if (rowAction === "copy") {
          castShiftCopySourceDate = row.dataset.shiftDate;
          updateCastShiftCopyButtons();
        }
        if (rowAction === "cancel-copy") {
          castShiftCopySourceDate = "";
          updateCastShiftCopyButtons();
        }
        if (rowAction === "paste") {
          const sourceRow = document.querySelector(`[data-cast-shift-entry-row][data-shift-date="${CSS.escape(castShiftCopySourceDate)}"]`);
          if (!sourceRow) return;
          const sourceStart = decimalTimeToClock(sourceRow.querySelector('[data-cast-shift-field="startTime"]')?.value || "");
          const sourceEnd = decimalTimeToClock(sourceRow.querySelector('[data-cast-shift-field="endTime"]')?.value || "");
          const requiredStartTime = row.dataset.requiredStart || "";
          const requiredEndTime = row.dataset.requiredEnd || "";
          if ((sourceStart && !isTimeWithinShiftRequirement(sourceStart, requiredStartTime, requiredEndTime))
            || (sourceEnd && !isTimeWithinShiftRequirement(sourceEnd, requiredStartTime, requiredEndTime))) {
            window.alert("コピーした時刻が、この日のシフト要求時間外です。");
            return;
          }
          inputs.forEach((input) => {
            const field = input.dataset.castShiftField;
            input.value = sourceRow.querySelector(`[data-cast-shift-field="${field}"]`)?.value || "";
          });
        }
        return;
      }

      const timeAdjustButton = event.target.closest("[data-shift-time-adjust]");
      if (timeAdjustButton) {
        adjustShiftBuilderTime(timeAdjustButton);
        return;
      }

      const shiftRequestButton = event.target.closest("[data-shift-request-action]");
      if (shiftRequestButton) {
        const action = shiftRequestButton.dataset.shiftRequestAction;
        const requestId = shiftRequestButton.dataset.shiftRequestId;
        if (action === "save") await saveShiftRequest();
        if (action === "shift-detail") renderShiftDateSettings(requestId);
        if (action === "cast-detail") renderShiftRequestDetail(requestId);
        if (action === "shift-create") renderShiftApplicationDetail(requestId);
        if (action === "save-created-shift") await saveCreatedShift(requestId);
        if (action === "cast-input") renderCastShiftEntry(requestId);
        if (action === "save-cast-input") await saveCastShiftEntry(requestId);
        if (action === "cast-input-back") renderCastShiftRequests();
        if (action === "save-date-settings") await saveShiftDateSettings(requestId);
        if (action === "publish") await publishShiftRequest(requestId);
        if (action === "back") renderShiftManagement();
        if (action === "delete") await deleteShiftRequest(requestId);
        if (action === "assign") {
          await assignShiftRequest(requestId, shiftRequestButton.dataset.accountNumber);
        }
        if (action === "status") {
          const request = findShiftRequest(requestId);
          const employeeNumber = shiftRequestButton.dataset.accountNumber;
          const account = loginAccounts.find((item) => item.employeeNumber === employeeNumber);
          const status = request ? shiftRequestSubmissionStatus(request, employeeNumber) : "未提出";
          renderShiftRequestDetail(requestId, `${account?.castName || employeeNumber}の提出状況：${status}`);
        }
        return;
      }

      const button = event.target.closest("[data-account-action]");
      if (!button) return;
      const action = button.dataset.accountAction;
      if (action === "new") {
        accountManagementNotice = "";
        openAccountEditor();
        return;
      }
      if (action === "edit") {
        accountManagementNotice = "";
        openAccountEditor(button.dataset.accountNumber);
        return;
      }
      if (action === "save") {
        await saveAccountEditor();
        return;
      }
      if (action === "cancel") {
        renderAccountManagement();
        return;
      }
      if (action === "delete") {
        const account = loginAccounts.find((item) => item.employeeNumber === button.dataset.accountNumber);
        if (account && !canEditAccount(account)) {
          accountManagementNotice = `${account.role}のアカウントを消去する権限がありません。`;
          renderAccountManagement();
          return;
        }
        if (!account || !window.confirm(`${account.castName}（${account.employeeNumber}）を消去しますか？`)) return;
        const accountIndex = loginAccounts.indexOf(account);
        loginAccounts.splice(accountIndex, 1);
        const saveResult = await saveLoginAccounts();
        accountManagementNotice = saveResult === "server"
          ? `${account.castName}（${account.employeeNumber}）をサーバーから消去しました。`
          : saveResult === "local"
            ? `${account.castName}（${account.employeeNumber}）をこのブラウザから消去しました。`
            : "消去結果の保存に失敗しました。ブラウザの保存設定を確認してください。";
        renderAccountManagement();
      }

      const status = zone.dataset.attendanceWorkingStatusDrop;
      if (!workingAttendanceTransitionAllowed(row, status)) {
        openAttendanceRestrictionPanel(row, status);
        return;
      }
      applyWorkingAttendanceStatus(row, status);
    });

    attendanceList.addEventListener("dragstart", (event) => {
      const card = event.target.closest("[data-attendance-name]");
      if (!card) return;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed = "copyMove";
      event.dataTransfer.setData("text/plain", card.dataset.attendanceName);
      event.dataTransfer.setData("application/x-akibaguild-cast", JSON.stringify({
        id: card.dataset.attendanceId,
        name: card.dataset.attendanceName
      }));
    });

    attendanceList.addEventListener("dragend", (event) => {
      const card = event.target.closest("[data-attendance-name]");
      if (card) card.classList.remove("dragging");
      clearTableDropTarget();
      clearAttendanceStatusDropTargets();
      clearAttendanceSalesDropTargets();
      clearAttendanceWorkingStatusDropTargets();
    });

    tableSheet.addEventListener("dragover", (event) => {
      const cell = event.target.closest("[data-table-slot][data-table-column]");
      if (!cell) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
      markTableDropPair(cell);
    });

    tableSheet.addEventListener("dragleave", (event) => {
      const cell = event.target.closest("[data-table-slot][data-table-column]");
      if (cell && !tableCellPair(cell).some((item) => item.contains(event.relatedTarget))) {
        tableCellPair(cell).forEach((item) => item.classList.remove("drop-target"));
      }
    });

    tableSheet.addEventListener("drop", (event) => {
      const cell = event.target.closest("[data-table-slot][data-table-column]");
      if (!cell) return;
      event.preventDefault();
      const droppedName = event.dataTransfer.getData("text/plain").trim();
      if (droppedName) openTableCellPanel(cell, droppedName);
      clearTableDropTarget();
    });

    tableSheet.addEventListener("click", (event) => {
      const cell = event.target.closest("[data-table-slot][data-table-column]");
      if (!cell) return;
      openTableCellPanel(cell);
    });

    tableDropPanel.addEventListener("click", (event) => {
      const restrictionButton = event.target.closest("[data-attendance-restriction-action]");
      if (restrictionButton) {
        closeAttendanceLatePanel();
        return;
      }

      const confirmButton = event.target.closest("[data-attendance-confirm-action]");
      if (confirmButton && pendingAttendanceStatusChange?.mode === "confirm") {
        if (confirmButton.dataset.attendanceConfirmAction === "save") {
          const { row, status } = pendingAttendanceStatusChange;
          closeAttendanceLatePanel();
          applyAttendanceStatus(row, status);
          return;
        }
        if (confirmButton.dataset.attendanceConfirmAction === "back") {
          closeAttendanceLatePanel();
          return;
        }
      }

      const lateActionButton = event.target.closest("[data-attendance-late-action]");
      if (lateActionButton && pendingAttendanceStatusChange) {
        if (lateActionButton.dataset.attendanceLateAction === "save") {
          const hour = document.querySelector("#attendanceLateHour").value;
          const minute = document.querySelector("#attendanceLateMinute").value;
          const lateTime = `${hour}:${minute}`;
          pendingAttendanceStatusChange.row.startTime = lateTime;
          pendingAttendanceStatusChange.row.lateTime = lateTime;
          pendingAttendanceStatusChange.row.status = "遅刻";
          pendingAttendanceStatusChange.row.lateEditing = false;
          closeAttendanceLatePanel();
          renderShiftTable();
          return;
        }
        if (lateActionButton.dataset.attendanceLateAction === "back") {
          closeAttendanceLatePanel();
          return;
        }
      }

      const actionButton = event.target.closest("[data-table-cell-action]");
      if (!actionButton || !pendingTableCellEdit) return;
      const action = actionButton.dataset.tableCellAction;

      if (action === "add") {
        syncTableCellEditorRows();
        pendingTableCellEdit.entries.push({ name: "", minute: pendingTableCellEdit.minuteOptions[0], status: "ディーラー" });
        renderTableCellEditorRows();
        return;
      }

      if (action === "remove") {
        syncTableCellEditorRows();
        const row = actionButton.closest("[data-table-editor-row]");
        const rows = Array.from(document.querySelectorAll("[data-table-editor-row]"));
        const index = rows.indexOf(row);
        if (index >= 0) pendingTableCellEdit.entries.splice(index, 1);
        renderTableCellEditorRows();
        return;
      }

      if (action === "save") {
        const editedCell = pendingTableCellEdit.cell;
        const previousEntries = readTableCellEntries(editedCell);
        const entries = Array.from(document.querySelectorAll("[data-table-editor-row]")).map((row) => ({
          name: row.querySelector("[data-table-entry-name]").value.trim(),
          minute: row.querySelector("[data-table-entry-minute]").value,
          status: row.querySelector("[data-table-entry-status]").value
        })).filter((entry) => entry.name);
        setTableCellEntries(editedCell, entries);
        registerNewNominationSessions(editedCell, previousEntries, entries);
        closeTableCellPanel();
        return;
      }

      if (action === "back") {
        closeTableCellPanel();
      }
    });

    sideShareList.addEventListener("click", (event) => {
      const departureButton = event.target.closest("[data-departure-notification-action][data-departure-notification-id]");
      if (departureButton) {
        const notificationIndex = departureNotifications.findIndex(
          (item) => item.id === departureButton.dataset.departureNotificationId
        );
        if (notificationIndex < 0) return;
        dismissedDepartureNotificationKeys.add(departureNotifications[notificationIndex].key);
        departureNotifications.splice(notificationIndex, 1);
        renderSideShareList();
        return;
      }

      const button = event.target.closest("[data-nomination-action][data-nomination-id]");
      if (!button) return;
      const session = nominationSessions.find((item) => item.id === button.dataset.nominationId && item.active);
      if (!session) return;

      if (button.dataset.nominationAction === "continue") {
        continueNominationSession(session);
        return;
      }

      if (button.dataset.nominationAction === "end") {
        session.active = false;
        renderSideShareList();
      }
    });

    completeBtn.addEventListener("click", () => {
      const totals = currentTotals();
      history.unshift({
        time: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }),
        method: paymentMethod.value,
        count: totals.count,
        total: totals.total
      });
      cart.clear();
      receivedInput.value = "";
      discountInput.value = 0;
      registerTransferNotice.hidden = true;
      registerTransferNotice.textContent = "";
      renderCart();
      renderHistory();
    });

    clearCartBtn.addEventListener("click", () => {
      cart.clear();
      registerTransferNotice.hidden = true;
      registerTransferNotice.textContent = "";
      renderCart();
    });

    endBusinessBtn.addEventListener("click", () => {
      businessStatus.textContent = "営業終了済み";
      endBusinessBtn.textContent = "営業終了済み";
      endBusinessBtn.disabled = true;
    });

    [searchBox, categoryFilter].forEach((control) => control.addEventListener("input", renderProducts));
    [discountInput, receivedInput, paymentMethod].forEach((control) => control.addEventListener("input", renderCart));

    renderProducts();
    synchronizeLoginAccountsWithServer();
    synchronizeShiftRequestsWithServer();
    renderCart();
    renderHistory();
    renderShiftTable();
    renderShareList();
    renderSideShareList();
    setInterval(() => {
      renderSideShareList();
      renderDepartureSchedule();
    }, 10000);
    setInterval(updateCurrentTimeLine, 10000);
    window.addEventListener("resize", updateCurrentTimeLine);
  </script>
</body>
</html>
